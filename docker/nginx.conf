# Configuração do Nginx para servir a SPA do frontend (Quasar/Vue).
#
# Estratégia adotada:
#   - SPA estática em /usr/share/nginx/html (gerada pelo `quasar build`).
#   - Rotas client-side (Vue Router em modo `history`) caem no fallback
#     para /index.html.
#   - Chamadas para /api/* são proxiadas para o backend (serviço `backend`
#     na network do Docker Compose). O trailing slash no `proxy_pass`
#     remove o prefixo /api antes de encaminhar, então /api/auth/login
#     vira /auth/login do ponto de vista do backend.
#   - Mesma origin no browser → CORS deixa de ser necessário em produção.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão para reduzir o payload da SPA.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache agressivo para assets versionados (Vite/Quasar já adiciona hash no nome).
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|svg|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Reverse proxy para o backend. O trailing slash em proxy_pass faz o
    # path rewrite: /api/auth/login -> http://backend:3000/auth/login.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback: tudo o que não é arquivo nem /api cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint simples para HEALTHCHECK do Docker.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
